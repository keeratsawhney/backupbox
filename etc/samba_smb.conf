### Global Settings ###
[global]
workgroup = WORKGROUP
wide links = yes
unix extensions = no
dns proxy = no

### Speed: full gigabit Ethernet ###
server min protocol = SMB2_10
use sendfile = yes
aio read size = 1
aio write size = 1
min receivefile size = 16384

### Debugging/Accounting ###
log level = 2
log file = /var/log/samba/smb.log
max log size = 1000
syslog = 0
panic action = /usr/share/samba/panic-action %d

### Authentication ###
security = user
map to guest = Bad User
guest account = www-data

### Mac and Windows: plain files ###
# the backup drives are exFAT, which has no extended attributes: Mac metadata in them (vfs fruit, streams_xattr)
# made Finder copies fail (error 100060). Finder keeps its metadata in "._" files on such drives anyway.
ea support = no
store dos attributes = no
map archive = no

### Share Definitions ###

[media]
comment = Little Backup Box media
include = /etc/samba/login.conf
path = /media
browseable = yes
force user = www-data
force group = www-data
admin users = www-data
writeable = yes
read only = no
create mask = 0777
directory mask = 0777
