# Comitup reverse proxy
# comitup-web (the Wi-Fi setup page) runs on 127.0.0.1:8099 (comitup-web-lbb.py), port 80 stays with the Backup Box

RedirectMatch 302 ^/comitup$ /comitup/

ProxyPass        /comitup/ http://127.0.0.1:8099/
ProxyPassReverse /comitup/ http://127.0.0.1:8099/

# Comitup uses absolute URLs for these endpoints
ProxyPass /confirm http://127.0.0.1:8099/confirm
ProxyPass /connect http://127.0.0.1:8099/connect
ProxyPass /blink   http://127.0.0.1:8099/blink
