# Builds the Android app (android/) and publishes it as the release "android":
#   https://github.com/keeratsawhney/backupbox/releases/download/android/BackupBox.apk
#
# Signing: one key for every build, so that updates install over the previous version.
# Repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64     the keystore file, base64
#   ANDROID_KEYSTORE_PASSWORD   its password
#   ANDROID_KEY_ALIAS           the key's alias
#   ANDROID_KEY_PASSWORD        the key's password
# Without them the APK is signed with a temporary debug key (installing it needs the old app removed first).

name: Android app

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/backupbox.keystore"
            echo "BACKUPBOX_KEYSTORE=$RUNNER_TEMP/backupbox.keystore" >> "$GITHUB_ENV"
            echo "Signing with the release key"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a debug key"
          fi

      - name: Build
        working-directory: android
        env:
          BACKUPBOX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BACKUPBOX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BACKUPBOX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/BackupBox.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: BackupBox-apk
          path: ${{ runner.temp }}/BackupBox.apk

      - name: Publish (release "android")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Backup Box for Android, build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7}). Install BackupBox.apk on the phone (allow installing apps from this source once)."
          if gh release view android >/dev/null 2>&1; then
            gh release edit android --title "Backup Box for Android" --notes "$NOTES"
          else
            gh release create android --title "Backup Box for Android" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release upload android "$RUNNER_TEMP/BackupBox.apk" --clobber
